<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phrasen">
<meta name="theme-color" content="#b3202a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Wien Phrasen</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --text:#1c1c1e; --dim:#6b6b70; --accent:#b3202a; --line:#e6e0d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --card:#1d1d1f; --text:#f2f2f2; --dim:#9a9aa0; --accent:#ff6b73; --line:#2c2c2e; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.35 -apple-system, system-ui, sans-serif;
         padding:0 16px env(safe-area-inset-bottom); }
  header { position:sticky; top:0; background:var(--bg); padding:calc(env(safe-area-inset-top) + 10px) 0 10px; z-index:2; }
  input { width:100%; font:inherit; padding:11px 14px; border-radius:12px; border:1px solid var(--line);
          background:var(--card); color:var(--text); }
  nav { display:flex; gap:8px; overflow-x:auto; padding:10px 0 2px; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav a { flex:none; padding:6px 12px; border-radius:999px; background:var(--card); border:1px solid var(--line);
          color:var(--text); text-decoration:none; font-size:14px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:22px 0 8px;
       scroll-margin-top:110px; }
  .p { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:0 0 8px; cursor:pointer; }
  .p:active { border-color:var(--accent); }
  .de { font-size:20px; font-weight:600; color:var(--accent); }
  .en { margin-top:2px; }
  .note { margin-top:4px; font-size:14px; color:var(--dim); }
  .empty { text-align:center; color:var(--dim); padding:40px 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <input id="q" type="search" placeholder="Search German or English…" autocomplete="off" autocapitalize="off">
  <nav id="nav"></nav>
</header>
<main id="list"></main>
<p class="empty" id="empty" hidden>No matches.</p>
<script>
const DATA = [{"title": "Essentials", "items": [{"de": "Entschuldigung!", "en": "Excuse me! / Sorry!", "note": ""}, {"de": "Bitte?", "en": "Pardon? / Could you repeat that?", "note": "also means 'please' and 'you're welcome'"}, {"de": "Ich verstehe nicht.", "en": "I don't understand.", "note": ""}, {"de": "Können Sie das bitte wiederholen?", "en": "Could you please repeat that?", "note": ""}, {"de": "Sprechen Sie Englisch?", "en": "Do you speak English?", "note": ""}, {"de": "Ich lerne Deutsch.", "en": "I'm learning German.", "note": "locals will appreciate the effort"}, {"de": "Mein Deutsch ist nicht so gut.", "en": "My German isn't so great.", "note": ""}, {"de": "Sprechen Sie bitte langsamer.", "en": "Please speak more slowly.", "note": ""}, {"de": "Wie sagt man ... auf Deutsch?", "en": "How do you say ... in German?", "note": ""}, {"de": "Hilfe!", "en": "Help!", "note": ""}, {"de": "Rufen Sie die Polizei!", "en": "Call the police!", "note": ""}, {"de": "Ich brauche einen Arzt.", "en": "I need a doctor.", "note": ""}, {"de": "Wo ist die nächste Apotheke?", "en": "Where is the nearest pharmacy?", "note": ""}, {"de": "Ich versuche es!", "en": "I'm trying!", "note": "shows effort — locals appreciate this"}]}, {"title": "Greetings", "items": [{"de": "Grüß Gott!", "en": "Hello!", "note": "standard Austrian greeting — literally 'greet God'"}, {"de": "Servus!", "en": "Hi! / Bye!", "note": "informal, very Austrian — used for both"}, {"de": "Grüß dich!", "en": "Hey! / Hi there!", "note": "informal version of Grüß Gott"}, {"de": "Baba!", "en": "Bye!", "note": "Viennese informal — like 'ciao'"}, {"de": "Wie geht's?", "en": "How's it going?", "note": "informal"}, {"de": "Danke, gut. Und Ihnen?", "en": "Fine, thanks. And you?", "note": "formal"}, {"de": "Danke, passt!", "en": "Thanks, all good!", "note": "very Austrian reply to 'how are you'"}, {"de": "Schönen Tag noch!", "en": "Have a nice day!", "note": ""}]}, {"title": "Sounding Austrian", "items": [{"de": "Genau.", "en": "Exactly. / Right.", "note": "the most useful word in German — use it while someone is talking to show you're following"}, {"de": "Stimmt.", "en": "That's true. / That's right.", "note": "another active listening word — use when someone makes a good point"}, {"de": "Ach so!", "en": "Oh I see! / Ah, right!", "note": "use when something clicks or is explained to you — signals understanding"}, {"de": "Leiwand!", "en": "Awesome! / Cool!", "note": ""}, {"de": "Na geh!", "en": "Oh come on! / No way!", "note": ""}, {"de": "Passt scho.", "en": "It's fine. / That works.", "note": ""}, {"de": "Gemma!", "en": "Let's go!", "note": ""}, {"de": "Schau ma moi.", "en": "We'll see. / Let's see how it goes.", "note": ""}, {"de": "Eh klar!", "en": "Of course! / Obviously!", "note": "'eh' is uniquely Austrian"}, {"de": "I hob ka Ahnung.", "en": "I have no idea.", "note": ""}]}, {"title": "Restaurant", "items": [{"de": "Einen Tisch für zwei, bitte.", "en": "A table for two, please.", "note": ""}, {"de": "Die Speisekarte, bitte.", "en": "The menu, please.", "note": ""}, {"de": "Was empfehlen Sie?", "en": "What do you recommend?", "note": ""}, {"de": "Ich nehme das.", "en": "I'll have that.", "note": "pointing at menu"}, {"de": "Einmal Schnitzel, bitte.", "en": "One Schnitzel, please.", "note": "'Einmal' = one order of"}, {"de": "Noch ein Bier, bitte.", "en": "Another beer, please.", "note": ""}, {"de": "Ein Viertel Weißwein, bitte.", "en": "A quarter liter of white wine, please.", "note": "standard wine measure in Austria"}, {"de": "Prost!", "en": "Cheers!", "note": ""}, {"de": "Es war ausgezeichnet!", "en": "It was excellent!", "note": ""}, {"de": "Zusammen oder getrennt?", "en": "Together or separate?", "note": "waiter asking how to split the bill"}, {"de": "Zusammen, bitte.", "en": "Together, please.", "note": "one bill"}, {"de": "Getrennt, bitte.", "en": "Separate, please.", "note": "split the bill"}, {"de": "Stimmt so.", "en": "Keep the change.", "note": "literally 'it's right as is' — how you tip in Austria"}, {"de": "Ich bin Vegetarier/Vegetarierin.", "en": "I'm vegetarian.", "note": "male/female"}, {"de": "Ohne Fleisch, bitte.", "en": "Without meat, please.", "note": ""}, {"de": "Mahlzeit!", "en": "Enjoy your meal! / Bon appétit!", "note": "also used as a general greeting around lunchtime"}, {"de": "Ein Leitungswasser, bitte.", "en": "A tap water, please.", "note": "Vienna tap water is famously excellent"}, {"de": "Ich hätte gerne einen Kaffee.", "en": "I would like a coffee.", "note": "hätte gerne = polite way to request a thing — more refined than 'ich möchte'"}, {"de": "Ich hätte gerne die Rechnung.", "en": "I would like the bill.", "note": ""}, {"de": "Ich hätte gerne etwas Wasser.", "en": "I would like some water.", "note": ""}, {"de": "Ich hätte gerne noch einen.", "en": "I would like another one.", "note": "useful at any food or drink stall"}, {"de": "Ich würde gerne reservieren.", "en": "I would like to make a reservation.", "note": "würde gerne = polite way to request to do something"}, {"de": "Ich würde gerne die Speisekarte sehen.", "en": "I would like to see the menu.", "note": ""}]}, {"title": "Coffee house", "items": [{"de": "Einen kleinen Schwarzen, bitte.", "en": "A small black coffee, please.", "note": "espresso — standard Viennese order"}, {"de": "Eine Melange, bitte.", "en": "A Melange, please.", "note": "half espresso, half steamed milk — the classic Vienna coffee"}, {"de": "Einen Verlängerten, bitte.", "en": "A Verlängerter, please.", "note": "espresso with extra hot water — like an Americano"}, {"de": "Mit Schlag, bitte.", "en": "With whipped cream, please.", "note": "you can add this to almost any coffee order"}, {"de": "Ein Glas Wasser dazu, bitte.", "en": "A glass of water with that, please.", "note": "Vienna coffeehouses always serve water — but ask if needed"}, {"de": "Ein Stück Apfelstrudel, bitte.", "en": "A slice of apple strudel, please.", "note": ""}, {"de": "Zahlen bitte.", "en": "The bill, please.", "note": "say this to get the check"}]}, {"title": "Getting around", "items": [{"de": "Wo ist die U-Bahn?", "en": "Where is the subway?", "note": "U-Bahn = underground/metro"}, {"de": "Einmal zum Stephansplatz, bitte.", "en": "One ticket to Stephansplatz, please.", "note": ""}, {"de": "Eine Tageskarte, bitte.", "en": "A day ticket, please.", "note": "unlimited travel for one day"}, {"de": "Wann fährt die nächste U-Bahn?", "en": "When does the next subway leave?", "note": ""}, {"de": "Wie komme ich zum Prater?", "en": "How do I get to the Prater?", "note": ""}, {"de": "Wie weit ist es zu Fuß?", "en": "How far is it on foot?", "note": ""}, {"de": "Geradeaus.", "en": "Straight ahead.", "note": ""}, {"de": "Links.", "en": "Left.", "note": ""}, {"de": "Rechts.", "en": "Right.", "note": ""}, {"de": "Wo ist die nächste Straßenbahn?", "en": "Where is the nearest tram?", "note": "Straßenbahn = tram, very common in Vienna"}]}, {"title": "Shopping", "items": [{"de": "Ich schaue mich nur um.", "en": "I'm just browsing.", "note": "say this when entering a shop so staff don't follow you"}, {"de": "Wie viel kostet das?", "en": "How much does that cost?", "note": ""}, {"de": "Kann ich das anprobieren?", "en": "Can I try this on?", "note": ""}, {"de": "Haben Sie das in einer anderen Größe?", "en": "Do you have this in another size?", "note": ""}, {"de": "Ich nehme es.", "en": "I'll take it.", "note": ""}, {"de": "Kann ich mit Karte zahlen?", "en": "Can I pay by card?", "note": ""}]}, {"title": "Small talk", "items": [{"de": "Woher kommen Sie?", "en": "Where are you from?", "note": "formal"}, {"de": "Ich komme aus Amerika / England / Australien.", "en": "I'm from America / England / Australia.", "note": ""}, {"de": "Ich bin zum ersten Mal in Wien.", "en": "It's my first time in Vienna.", "note": ""}, {"de": "Wien ist wunderschön!", "en": "Vienna is beautiful!", "note": ""}, {"de": "Das Essen hier ist fantastisch.", "en": "The food here is fantastic.", "note": ""}, {"de": "Ich liebe Wien.", "en": "I love Vienna.", "note": ""}, {"de": "Das ist sehr nett von Ihnen.", "en": "That's very kind of you.", "note": ""}]}, {"title": "Christmas market", "items": [{"de": "Ein Glühwein, bitte.", "en": "A mulled wine, please.", "note": "short order form — full sentence: 'Ich möchte einen Glühwein'"}, {"de": "Ein Punsch, bitte.", "en": "A Punsch, please.", "note": "hot rum punch — more Austrian than Glühwein, try this"}, {"de": "Behalte ich den Becher?", "en": "Do I keep the cup?", "note": "asking about the souvenir mug — you usually can for ~€2-5 deposit"}, {"de": "Ich möchte meinen Pfand zurück.", "en": "I'd like my deposit back.", "note": "return the mug to get your Pfand refunded"}, {"de": "Einmal Maroni, bitte.", "en": "A bag of roasted chestnuts, please.", "note": "sold at every market — eat them hot"}]}, {"title": "Numbers", "items": [{"de": "eins", "en": "1", "note": ""}, {"de": "zwei", "en": "2", "note": ""}, {"de": "drei", "en": "3", "note": ""}, {"de": "vier", "en": "4", "note": ""}, {"de": "fünf", "en": "5", "note": ""}, {"de": "sechs", "en": "6", "note": ""}, {"de": "sieben", "en": "7", "note": ""}, {"de": "acht", "en": "8", "note": ""}, {"de": "neun", "en": "9", "note": ""}, {"de": "zehn", "en": "10", "note": ""}]}];
const list = document.getElementById('list'), nav = document.getElementById('nav');
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

DATA.forEach((s, i) => {
  const a = document.createElement('a'); a.href = '#s' + i; a.textContent = s.title; nav.appendChild(a);
  const h = document.createElement('h2'); h.id = 's' + i; h.textContent = s.title; list.appendChild(h);
  s.items.forEach(p => {
    const d = document.createElement('div'); d.className = 'p';
    d.dataset.k = (p.de + ' ' + p.en + ' ' + p.note).toLowerCase();
    d.dataset.say = p.de;
    d.innerHTML = `<div class="de">${esc(p.de)}</div><div class="en">${esc(p.en)}</div>` +
                  (p.note ? `<div class="note">${esc(p.note)}</div>` : '');
    list.appendChild(d);
  });
});

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\.\.\./g, ''));
  u.lang = 'de-AT';
  const v = speechSynthesis.getVoices().find(v => v.lang.replace('_','-') === 'de-AT') ||
            speechSynthesis.getVoices().find(v => v.lang.startsWith('de'));
  if (v) u.voice = v;
  u.rate = 0.85;
  speechSynthesis.speak(u);
}
list.addEventListener('click', e => { const p = e.target.closest('.p'); if (p) speak(p.dataset.say); });

document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  list.querySelectorAll('.p').forEach(p => { const m = !q || p.dataset.k.includes(q); p.hidden = !m; shown += m; });
  list.querySelectorAll('h2').forEach(h => {
    let n = h.nextElementSibling, any = false;
    while (n && n.tagName !== 'H2') { if (!n.hidden) any = true; n = n.nextElementSibling; }
    h.hidden = !any;
  });
  document.getElementById('empty').hidden = shown > 0;
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
